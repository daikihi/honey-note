<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>HoneyNote | 蜜源の詳細</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/honey_note/css/common_form.css">
    <script type="module">
        import init, { flower_show_main } from '/honey_note/javascript/front.js';
        init().then(() => flower_show_main());
    </script>
</head>
<body>
<header>
    <nav>
        <div class="nav-left">
            <a class="logo" href="/honey_note/index.html">
                <img src="/honey_note/icons/honeu_note_logo_v0.0.1.jpeg" alt="HoneyNote Logo">
                HoneyNote
            </a>
        </div>
        <div class="nav-links">
            <a href="/honey_note/honeys/lists.html">はちみつ一覧</a>
            <a href="/honey_note/flowers/lists.html">蜜源リスト</a>
            <a href="/honey_note/beekeepers/lists.html">養蜂場</a>
        </div>
    </nav>
</header>

<main>
    <section id="flower_detail" hidden>
        <h1 id="page_title">蜜源の詳細</h1>
        <div class="section">
            <h2>基本情報</h2>
            <div class="info-grid">
                <div class="label">和名</div><div id="field_name_jp">-</div>
                <div class="label">英名</div><div id="field_name_en">-</div>
                <div class="label">学名</div><div id="field_scientific_name">-</div>
                <div class="label">分類</div><div id="field_flower_type">-</div>
                <div class="label">短い説明</div><div id="field_short_note">-</div>
                <div class="label">画像</div><div><img id="field_image" alt="" hidden style="max-width: 100%; height: auto;"></div>
                <div class="label">メモ</div><div id="field_note">-</div>
            </div>
        </div>
        <div class="actions">
            <a class="btn-back" href="/honey_note/flowers/lists.html">一覧に戻る</a>
            <a class="btn-edit" id="btn_edit_link" href="/honey_note/flowers/edit.html">編集する</a>
        </div>
    </section>

    <section id="error_panel" class="section" hidden>
        <h1>蜜源を表示できません</h1>
        <p id="error_message"></p>
        <div class="actions">
            <a class="btn-back" href="/honey_note/flowers/lists.html">一覧に戻る</a>
        </div>
    </section>
</main>
</body>
</html>
