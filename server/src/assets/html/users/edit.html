<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HoneyNote | 表示名の編集</title>
    <link rel="stylesheet" href="/honey_note/css/common_form.css">
    <link rel="stylesheet" href="/honey_note/css/user.css">
    <script type="module">
        import init, { user_edit_main } from '/honey_note/javascript/front.js';
        init().then(user_edit_main);
    </script>
</head>
<body>
<header>
    <nav>
        <div class="nav-left"><a class="logo" href="/honey_note/index.html"><img src="/honey_note/icons/honeu_note_logo_v0.0.1.jpeg" alt="HoneyNote Logo">HoneyNote</a></div>
        <div class="nav-links"><a href="/honey_note/honeys/lists.html">はちみつ一覧</a><a href="/honey_note/flowers/lists.html">蜜源リスト</a><a href="/honey_note/beekeepers/lists.html">養蜂場</a></div>
    </nav>
</header>
<main>
    <h1>表示名の編集</h1>
    <p class="error-message" id="error_message" role="alert"></p>
    <form id="display_name_form">
        <div class="section">
            <h2>基本情報</h2>
            <div class="info-grid">
                <label class="label" for="display_name">表示名 <span class="required">*</span></label>
                <div><input type="text" name="display_name" id="display_name" required autocomplete="nickname" aria-describedby="display_name_hint"><small id="display_name_hint">50文字以内</small></div>
            </div>
        </div>
        <div class="actions">
            <a class="btn-cancel" href="/honey_note/users/show.html">キャンセル</a>
            <button class="btn-save" type="submit" id="btn_save">保存</button>
        </div>
    </form>
</main>
</body>
</html>
